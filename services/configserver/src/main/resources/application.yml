spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/eazybytes/eazybytes-config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          timeout: 5
          clone-on-start: true
          force-pull: true
  security:
    user:
      name: ${CONFIG_USERNAME:configuser}
      password: ${CONFIG_PASSWORD:configpassword}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

encrypt:
  key: ${ENCRYPT_KEY:changeme}

server:
  port: 8071

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
