name: CD - Deploy Dev

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Deploy with Helm
        run: |
          helm upgrade --install eazybank-${{ github.event.inputs.environment }} \
            ./infrastructure/helm/eazybank-services \
            -f ./infrastructure/helm/environments/${{ github.event.inputs.environment }}/values.yaml \
            --namespace eazybank-${{ github.event.inputs.environment }} \
            --create-namespace \
            --wait \
            --timeout 10m
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
