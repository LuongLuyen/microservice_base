name: CI - Main

on:
  push:
    branches: [ main, "4.0.0" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Login to Docker Hub
        if: ${{ (secrets.DOCKER_USERNAME != '' || secrets.DOCKERHUB_USERNAME != '') && (secrets.DOCKER_PASSWORD != '' || secrets.DOCKER_TOKEN != '' || secrets.DOCKERHUB_TOKEN != '') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images with Jib
        if: ${{ (secrets.DOCKER_USERNAME != '' || secrets.DOCKERHUB_USERNAME != '') && (secrets.DOCKER_PASSWORD != '' || secrets.DOCKER_TOKEN != '' || secrets.DOCKERHUB_TOKEN != '') }}
        run: |
          mvn compile jib:build \
            -Dimage.tag=${{ github.sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
