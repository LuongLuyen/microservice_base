replicaCount: 2
image:
  repository: eazybytes/accounts
  tag: "1.0.0"
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
probes:
  readiness:
    path: /actuator/health/readiness
    port: 8080
  liveness:
    path: /actuator/health/liveness
    port: 8080
  startup:
    path: /actuator/health
    port: 8080
    initialDelaySeconds: 30
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
