apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eazybank-prod-apps
  namespace: argocd
spec:
  project: eazybank-prod
  source:
    repoURL: https://github.com/eazybytes/microservices.git
    targetRevision: main
    path: infrastructure/helm/eazybank-services
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eazybank-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
